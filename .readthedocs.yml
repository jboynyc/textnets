version: 2

# Build documentation in the docs directory with Sphinx
sphinx:
  configuration: docs/conf.py

build:
  os: "ubuntu-lts-latest"
  tools:
    python: "3.12"
  jobs:
    post_install:
      - pip install pdm==2.26.1
      - pdm use -f $READTHEDOCS_VIRTUALENV_PATH
      - pdm install -dG doc
